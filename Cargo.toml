[package]
name = "omarchy-meeting-recorder"
version = "1.0.2"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libc = "0.2.189"
regex = "1.12.3"
serde_json = "1.0.151"
sherpa-rs-sys = { version = "0.6.8", default-features = false, features = ["static"] }
ureq = "3.4.2"
whisper-rs = "0.16"

[features]
default = []
# GPU transcription through whisper.cpp's Vulkan backend. Needs the Vulkan
# headers (`vulkan-headers` on Arch) and glslc (`shaderc`) to build.
vulkan = ["whisper-rs/vulkan"]
